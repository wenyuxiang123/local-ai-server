name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - abi: arm64-v8a
            needs_vulkan: true
          - abi: x86_64
            needs_vulkan: false
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        cache-disabled: true
    
    - name: Install Vulkan SDK
      if: matrix.needs_vulkan == true
      run: |
        sudo apt-get update
        sudo apt-get install -y libvulkan-dev vulkan-tools
    
    - name: Clone llama.cpp
      run: |
        git clone https://github.com/ggml-org/llama.cpp.git ${GITHUB_WORKSPACE}/llama-cpp-src
        cd ${GITHUB_WORKSPACE}/llama-cpp-src
        git checkout 5f5e39e1ba5d
        echo "llama.cpp checked out at known-good commit 5f5e39e1ba5d"
        ls -la ${GITHUB_WORKSPACE}/llama-cpp-src | head -20
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Build Release APK
      run: ./gradlew assembleRelease --no-daemon
      env:
        # Pass llama.cpp source path to CMake via Gradle properties
        LLAMA_CPP_SRC: ${{ github.workspace }}/llama-cpp-src
        # Pass target ABI to CMake
        ANDROID_ABI: ${{ matrix.abi }}
    
    - name: Upload unsigned APK
      uses: actions/upload-artifact@v4
      with:
        name: LocalAI-Server-unsigned-APK-${{ matrix.abi }}
        path: app/build/outputs/apk/release/app-release-unsigned.apk
