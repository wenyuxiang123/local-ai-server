name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
    
    - name: Clone llama.cpp
      run: |
        git clone https://github.com/ggml-org/llama.cpp.git ${GITHUB_WORKSPACE}/llama-cpp-src --depth 1 --single-branch
        echo "llama.cpp cloned successfully"
        ls -la ${GITHUB_WORKSPACE}/llama-cpp-src | head -20
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Build Release APK
      run: ./gradlew assembleRelease --no-daemon
      env:
        # Pass llama.cpp source path to CMake via Gradle properties
        LLAMA_CPP_SRC: ${{ github.workspace }}/llama-cpp-src
    
    - name: Upload unsigned APK
      uses: actions/upload-artifact@v4
      with:
        name: LocalAI-Server-unsigned-APK
        path: app/build/outputs/apk/release/app-release-unsigned.apk
